<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1f47" />
      <stop offset="100%" stop-color="#191326" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2c19" />
      <stop offset="100%" stop-color="#22180d" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193d28" />
      <stop offset="100%" stop-color="#0e2217" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" fill="url(#bgGrad)" rx="16" />
  <rect width="958" height="478" x="1" y="1" fill="none" stroke="#30363d" stroke-width="2" rx="15" />

  <!-- Title Header -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">CalibRaw MCP — System Architecture &amp; Workflow</text>
  <text x="40" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Natural language AI darkroom grading, Planckian physics, and non-destructive .calibraw sidecars</text>

  <!-- Card 1: AI Assistant & User -->
  <g transform="translate(40, 105)">
    <rect width="260" height="320" rx="12" fill="url(#blueCard)" stroke="#388bfd" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="28" cy="30" r="12" fill="#1f6feb" />
    <text x="28" y="34" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">AI</text>
    <text x="50" y="35" font-family="sans-serif" font-size="15" font-weight="700" fill="#58a6ff">LLM Assistant</text>
    <text x="50" y="52" font-family="sans-serif" font-size="11" fill="#8b949e">Claude • Cursor • Windsurf</text>

    <!-- Chat Prompt Bubble -->
    <rect x="18" y="75" width="224" height="85" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="28" y="98" font-family="sans-serif" font-size="12" font-style="italic" fill="#c9d1d9">"Warm portrait to 5600K,</text>
    <text x="28" y="116" font-family="sans-serif" font-size="12" font-style="italic" fill="#c9d1d9">recover highlights by -30,</text>
    <text x="28" y="134" font-family="sans-serif" font-size="12" font-style="italic" fill="#c9d1d9">and isolate subject mask."</text>

    <!-- MCP Tool Call Intent -->
    <rect x="18" y="175" width="224" height="120" rx="8" fill="#0d1117" stroke="#238636"/>
    <text x="28" y="196" font-family="monospace" font-size="11" font-weight="bold" fill="#3fb950">⚙ Tool Invocations:</text>
    <text x="28" y="218" font-family="monospace" font-size="10" fill="#7ee787">• set_white_balance()</text>
    <text x="28" y="238" font-family="monospace" font-size="10" fill="#7ee787">• update_image_edits()</text>
    <text x="28" y="258" font-family="monospace" font-size="10" fill="#7ee787">• add_mask("Subject")</text>
    <text x="28" y="278" font-family="monospace" font-size="10" fill="#7ee787">• export_image()</text>
  </g>

  <!-- Flow Arrow 1 -->
  <g transform="translate(305, 260)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#58a6ff" stroke-width="3" stroke-dasharray="4 2"/>
    <polygon points="35,-6 45,0 35,6" fill="#58a6ff"/>
    <text x="22" y="-12" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">JSON-RPC</text>
  </g>

  <!-- Card 2: CalibRaw MCP Engine -->
  <g transform="translate(355, 105)">
    <rect width="260" height="320" rx="12" fill="url(#purpleCard)" stroke="#bc8cff" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="28" cy="30" r="12" fill="#8957e5" />
    <text x="28" y="34" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">⚙</text>
    <text x="50" y="35" font-family="sans-serif" font-size="15" font-weight="700" fill="#d2a8ff">CalibRaw MCP</text>
    <text x="50" y="52" font-family="sans-serif" font-size="11" fill="#8b949e">18 MCP Darkroom Tools</text>

    <!-- Sub-engine modules -->
    <rect x="18" y="75" width="224" height="48" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="28" y="94" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc">Planckian White Balance</text>
    <text x="28" y="110" font-family="sans-serif" font-size="10" fill="#8b949e">±500 mireds • McCamy CCT • 200+ WB</text>

    <rect x="18" y="132" width="224" height="48" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="28" y="151" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc">Develop Sliders &amp; Curves</text>
    <text x="28" y="167" font-family="sans-serif" font-size="10" fill="#8b949e">Sigmoid rolloff • Tone &amp; HSL splines</text>

    <rect x="18" y="189" width="224" height="48" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="28" y="208" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc">AI &amp; Geometric Masking</text>
    <text x="28" y="224" font-family="sans-serif" font-size="10" fill="#8b949e">Subject/Sky • Radial • Point Color</text>

    <rect x="18" y="246" width="224" height="48" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="28" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc">Master Rendering Pipeline</text>
    <text x="28" y="281" font-family="sans-serif" font-size="10" fill="#8b949e">Darktable CLI bridge • rawpy 16-bit</text>
  </g>

  <!-- Flow Arrow 2 -->
  <g transform="translate(620, 260)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#bc8cff" stroke-width="3" stroke-dasharray="4 2"/>
    <polygon points="35,-6 45,0 35,6" fill="#bc8cff"/>
    <text x="22" y="-12" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Outputs</text>
  </g>

  <!-- Card 3: Non-Destructive Results -->
  <g transform="translate(665, 105)">
    <rect width="255" height="320" rx="12" fill="url(#greenCard)" stroke="#3fb950" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="28" cy="30" r="12" fill="#238636" />
    <text x="28" y="34" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="50" y="35" font-family="sans-serif" font-size="15" font-weight="700" fill="#56d364">Pristine Output</text>
    <text x="50" y="52" font-family="sans-serif" font-size="11" fill="#8b949e">Non-destructive &amp; Master</text>

    <!-- Box A: Sidecar JSON -->
    <rect x="18" y="75" width="219" height="105" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="28" y="96" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e3b341">📄 .calibraw Sidecar</text>
    <text x="28" y="116" font-family="monospace" font-size="10" fill="#8b949e">format: "CalibRaw sidecar"</text>
    <text x="28" y="132" font-family="monospace" font-size="10" fill="#8b949e">schema_version: 1</text>
    <text x="28" y="148" font-family="monospace" font-size="10" fill="#7ee787">exposure: +0.25, temp: 5600K</text>
    <text x="28" y="164" font-family="monospace" font-size="10" fill="#79c0ff">masks: ["Subject Pop"]</text>

    <!-- Box B: Export Master -->
    <rect x="18" y="190" width="219" height="105" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="28" y="211" font-family="sans-serif" font-size="11" font-weight="bold" fill="#56d364">🖼 Master Render</text>
    <text x="28" y="231" font-family="sans-serif" font-size="10" fill="#c9d1d9">• 4:4:4 Chroma Subsampling</text>
    <text x="28" y="247" font-family="sans-serif" font-size="10" fill="#c9d1d9">• Full-resolution sensor master</text>
    <text x="28" y="263" font-family="sans-serif" font-size="10" fill="#c9d1d9">• Sigmoid tone &amp; highlight recovery</text>
    <text x="28" y="279" font-family="sans-serif" font-size="10" fill="#c9d1d9">• Camera original untouched</text>
  </g>
</svg>
