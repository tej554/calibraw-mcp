<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="rawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="50%" stop-color="#5a6578" />
      <stop offset="100%" stop-color="#3a4556" />
    </linearGradient>
    <linearGradient id="gradedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="40%" stop-color="#b45309" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" fill="url(#cardBg)" rx="14" />
  <rect width="958" height="418" x="1" y="1" fill="none" stroke="#30363d" stroke-width="2" rx="13" />

  <!-- Title -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Before &amp; After Grading Transformation</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8b949e">Demonstration of Planckian White Balance, Kodak Portra 400 film rolloff, and AI Subject Mask</text>

  <!-- Split Viewport Frame -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <!-- Before Half (Left) -->
    <clipPath id="leftClip">
      <rect width="438" height="230" rx="10" />
    </clipPath>
    <g clip-path="url(#leftClip)">
      <rect width="438" height="230" fill="url(#rawGrad)"/>
      <!-- Raw Flat Visual Overlay -->
      <circle cx="219" cy="115" r="60" fill="#6b7280" opacity="0.6"/>
      <path d="M 120 200 Q 219 140 318 200" stroke="#4b5563" stroke-width="8" fill="none"/>
      
      <!-- Before Badge -->
      <rect x="20" y="20" width="130" height="28" rx="6" fill="#000000" opacity="0.75"/>
      <text x="85" y="38" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">BEFORE (Flat RAW)</text>

      <!-- Raw metrics overlay -->
      <rect x="20" y="155" width="180" height="55" rx="6" fill="#000000" opacity="0.7"/>
      <text x="30" y="174" font-family="monospace" font-size="10" fill="#9ca3af">• WB: As-Shot (Muddy 4200K)</text>
      <text x="30" y="189" font-family="monospace" font-size="10" fill="#9ca3af">• Contrast: Linear Flat</text>
      <text x="30" y="202" font-family="monospace" font-size="10" fill="#9ca3af">• Subject: Low Separation</text>
    </g>

    <!-- Center Divider Line -->
    <line x1="439" y1="0" x2="439" y2="230" stroke="#f0f6fc" stroke-width="3"/>
    <circle cx="439" cy="115" r="16" fill="#f0f6fc" stroke="#0d1117" stroke-width="3"/>
    <text x="439" y="119" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0d1117" text-anchor="middle">◀ ▶</text>

    <!-- After Half (Right) -->
    <g transform="translate(440, 0)">
      <clipPath id="rightClip">
        <rect width="438" height="230" rx="10" />
      </clipPath>
      <g clip-path="url(#rightClip)">
        <rect width="438" height="230" fill="url(#gradedGrad)"/>
        <!-- Golden warmth & sky gradient -->
        <circle cx="219" cy="115" r="60" fill="#fde68a" opacity="0.8"/>
        <path d="M 120 200 Q 219 140 318 200" stroke="#1e293b" stroke-width="8" fill="none"/>

        <!-- After Badge -->
        <rect x="288" y="20" width="130" height="28" rx="6" fill="#000000" opacity="0.75"/>
        <text x="353" y="38" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle">AFTER (Graded Master)</text>

        <!-- Graded metrics overlay -->
        <rect x="238" y="155" width="180" height="55" rx="6" fill="#000000" opacity="0.7"/>
        <text x="248" y="174" font-family="monospace" font-size="10" fill="#a7f3d0">• WB: Planckian 5600K (+10 Tint)</text>
        <text x="248" y="189" font-family="monospace" font-size="10" fill="#a7f3d0">• Tone: Kodak Portra S-Curve</text>
        <text x="248" y="202" font-family="monospace" font-size="10" fill="#a7f3d0">• AI Subject Pop: +0.35 EV</text>
      </g>
    </g>
  </g>

  <!-- Bottom Histogram Visualizer -->
  <g transform="translate(40, 345)">
    <rect width="880" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="31" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Dynamic Range Preservation:</text>
    
    <!-- Mini Histogram Flat (Left) -->
    <path d="M 230 42 Q 280 15 320 42 Z" fill="#6b7280" opacity="0.6"/>
    <text x="330" y="31" font-family="monospace" font-size="10" fill="#8b949e">Uncorrected RAW (Compressed Midtones)</text>

    <!-- Arrow -->
    <text x="590" y="31" font-family="sans-serif" font-size="14" fill="#58a6ff">➔</text>

    <!-- Mini Histogram Graded (Right) -->
    <path d="M 620 42 Q 670 10 740 42 Z" fill="#22c55e" opacity="0.6"/>
    <text x="750" y="31" font-family="monospace" font-size="10" fill="#4ade80">CalibRaw Sigmoid (Balanced 14-bit)</text>
  </g>
</svg>
